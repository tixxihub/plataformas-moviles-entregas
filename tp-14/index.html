<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">

                <h2>Contactos</h2>

                <div class="mb-3">
                    <button id="ordenar-nombre" class="btn btn-secondary">
                        Ordenar por Nombre
                    </button>

                    <button id="ordenar-apellido" class="btn btn-secondary">
                        Ordenar por Apellido
                    </button>

                    <button id="mostrar-todos" class="btn btn-primary">
                        Mostrar Todos
                    </button>

                    <button id="mostrar-favoritos" class="btn btn-warning">
                        Mostrar Favoritos
                    </button>
                </div>

                <ul id="lista-contactos"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input type="text"
                               class="form-control"
                               name="nombre"
                               id="input-nombre"
                               placeholder="Nombre"
                               aria-label="Nombre">

                        <input type="text"
                               class="form-control"
                               name="apellido"
                               id="input-apellido"
                               placeholder="Apellido"
                               aria-label="Apellido">

                        <input type="text"
                               class="form-control"
                               name="telefono"
                               id="input-telefono"
                               placeholder="Teléfono"
                               aria-label="Teléfono">

                    </div>

                    <button class="btn btn-primary" type="submit">
                        Agregar Contacto
                    </button>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '123456789',
                favorito: false
            },
        ];


        /**
         * agregarContacto()
         * Agrega un nuevo contacto a la lista.
         */
        function agregarContacto(nombre, apellido, telefono) {

            if (nombre.trim() === "" || apellido.trim() === "") {
                return;
            }

            const nuevoContacto = {
                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                favorito: false
            };

            contactos.push(nuevoContacto);

            mostrarListado();
        }


        /**
         * mostrarListado()
         * Muestra todos los contactos.
         */
        function mostrarListado(lista = contactos) {

            const listaContactos = document.querySelector('#lista-contactos');

            listaContactos.innerHTML = "";

            lista.forEach(function(contacto) {

                const elemento = document.createElement('li');

                elemento.classList.add(
                    'list-group-item',
                    'd-flex',
                    'justify-content-between',
                    'align-items-center',
                    'mb-2'
                );

                const informacion = document.createElement('span');

                informacion.textContent =
                    contacto.apellido + ", " +
                    contacto.nombre + " - Tel: " +
                    contacto.telefono;

                elemento.appendChild(informacion);


                const botonFavorito = document.createElement('button');

                if (contacto.favorito) {
                    botonFavorito.textContent = "★ Favorito";
                    botonFavorito.classList.add('btn', 'btn-warning');
                } else {
                    botonFavorito.textContent = "☆ Favorito";
                    botonFavorito.classList.add('btn', 'btn-outline-warning');
                }


                botonFavorito.addEventListener('click', function() {

                    contacto.favorito = !contacto.favorito;

                    mostrarListado(lista);

                });


                elemento.appendChild(botonFavorito);

                listaContactos.appendChild(elemento);

            });
        }


        /**
         * Ordenar por nombre.
         */
        document.querySelector('#ordenar-nombre').addEventListener('click', function() {

            contactos.sort(function(a, b) {

                return a.nombre.localeCompare(b.nombre);

            });

            mostrarListado();

        });


        /**
         * Ordenar por apellido.
         */
        document.querySelector('#ordenar-apellido').addEventListener('click', function() {

            contactos.sort(function(a, b) {

                return a.apellido.localeCompare(b.apellido);

            });

            mostrarListado();

        });


        /**
         * Mostrar todos los contactos.
         */
        document.querySelector('#mostrar-todos').addEventListener('click', function() {

            mostrarListado();

        });


        /**
         * Mostrar solamente favoritos.
         */
        document.querySelector('#mostrar-favoritos').addEventListener('click', function() {

            const favoritos = contactos.filter(function(contacto) {

                return contacto.favorito === true;

            });

            mostrarListado(favoritos);

        });


        /**
         * Formulario.
         */
        function handlerFormulario(e) {

            e.preventDefault();

            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";

            agregarContacto(nombre, apellido, telefono);
        }


        document.querySelector('form').addEventListener('submit', handlerFormulario);


        // Mostrar los contactos iniciales
        mostrarListado();

    </script>

</body>
</html>
