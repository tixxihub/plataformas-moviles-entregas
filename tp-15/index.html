<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Tablero de Puntos</h1>

        <div class="card">
            <div class="card-body">

                <div class="row text-center">

                    <div class="col-5">
                        <span id="puntos-local" class="display-1">0</span>
                        <p class="m-0">Local</p>
                    </div>

                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>

                    <div class="col-5">
                        <span id="puntos-visitante" class="display-1">0</span>
                        <p class="m-0">Visitante</p>
                    </div>

                </div>

                <hr class="hr">

                <h2>Actualizar Contador</h2>

                <div class="row">

                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-local-mas" class="btn d-block w-100 btn-primary">
                            Local +
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-local-menos" class="btn d-block w-100 btn-secondary">
                            Local -
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-visitante-mas" class="btn d-block w-100 btn-primary">
                            Visitante +
                        </button>
                    </div>

                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-visitante-menos" class="btn d-block w-100 btn-secondary">
                            Visitante -
                        </button>
                    </div>

                </div>

                <hr class="hr">

                <div class="row">

                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-invertir" class="btn d-block w-100 btn-warning">
                            Invertir Puntaje
                        </button>
                    </div>

                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-finalizar" class="btn d-block w-100 btn-dark">
                            Finalizar Partido
                        </button>
                    </div>

                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-reinicio" class="btn d-block w-100 btn-danger">
                            Reinicio
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7QabWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;


        /**
         * Actualiza los puntos mostrados en pantalla.
         */
        function actualizarTablero() {

            document.querySelector("#puntos-local").textContent = puntosLocal;
            document.querySelector("#puntos-visitante").textContent = puntosVisitante;

        }


        /**
         * Sumar punto al equipo local.
         */
        document.querySelector("#btn-local-mas").addEventListener("click", function() {

            if (!partidoFinalizado) {
                puntosLocal++;
                actualizarTablero();
            }

        });


        /**
         * Restar punto al equipo local.
         */
        document.querySelector("#btn-local-menos").addEventListener("click", function() {

            if (!partidoFinalizado && puntosLocal > 0) {
                puntosLocal--;
                actualizarTablero();
            }

        });


        /**
         * Sumar punto al equipo visitante.
         */
        document.querySelector("#btn-visitante-mas").addEventListener("click", function() {

            if (!partidoFinalizado) {
                puntosVisitante++;
                actualizarTablero();
            }

        });


        /**
         * Restar punto al equipo visitante.
         */
        document.querySelector("#btn-visitante-menos").addEventListener("click", function() {

            if (!partidoFinalizado && puntosVisitante > 0) {
                puntosVisitante--;
                actualizarTablero();
            }

        });


        /**
         * Invertir puntaje.
         */
        document.querySelector("#btn-invertir").addEventListener("click", function() {

            if (!partidoFinalizado) {

                let temporal = puntosLocal;

                puntosLocal = puntosVisitante;
                puntosVisitante = temporal;

                actualizarTablero();
            }

        });


        /**
         * Finalizar partido.
         */
        document.querySelector("#btn-finalizar").addEventListener("click", function() {

            partidoFinalizado = true;

            document.querySelector("#btn-local-mas").disabled = true;
            document.querySelector("#btn-local-menos").disabled = true;
            document.querySelector("#btn-visitante-mas").disabled = true;
            document.querySelector("#btn-visitante-menos").disabled = true;
            document.querySelector("#btn-invertir").disabled = true;

        });


        /**
         * Reiniciar tablero.
         */
        document.querySelector("#btn-reinicio").addEventListener("click", function() {

            puntosLocal = 0;
            puntosVisitante = 0;
            partidoFinalizado = false;

            document.querySelector("#btn-local-mas").disabled = false;
            document.querySelector("#btn-local-menos").disabled = false;
            document.querySelector("#btn-visitante-mas").disabled = false;
            document.querySelector("#btn-visitante-menos").disabled = false;
            document.querySelector("#btn-invertir").disabled = false;

            actualizarTablero();

        });

    </script>

</body>
</html>
