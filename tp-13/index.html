<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">

                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">
                            Agregar Producto
                        </button>
                    </div>
                </form>

                <div class="row">

                    <div class="col-12 col-md-4 mb-2">
                        <button id="btn-ordenar" class="btn btn-secondary w-100">
                            Ordenar A-Z
                        </button>
                    </div>

                    <div class="col-12 col-md-4 mb-2">
                        <button id="btn-limpiar" class="btn btn-danger w-100">
                            Limpiar Lista
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        /**
         * agregarProducto()
         * Esta función agrega un producto a la lista.
         */
        function agregarProducto(nombreProducto) {

            if (nombreProducto.trim() === "") {
                return;
            }

            const lista = document.querySelector("#lista-productos");

            const nuevoProducto = document.createElement("li");

            nuevoProducto.classList.add(
                "d-flex",
                "justify-content-between",
                "align-items-center",
                "mb-2"
            );

            const nombre = document.createElement("span");
            nombre.textContent = nombreProducto;

            const botonEliminar = document.createElement("button");

            botonEliminar.textContent = "Eliminar";
            botonEliminar.classList.add("btn", "btn-sm", "btn-danger");

            botonEliminar.addEventListener("click", function() {
                nuevoProducto.remove();
            });

            nuevoProducto.appendChild(nombre);
            nuevoProducto.appendChild(botonEliminar);

            lista.appendChild(nuevoProducto);
        }


        /**
         * Maneja el formulario.
         */
        function handlerFormulario(evento) {

            evento.preventDefault();

            const input = evento.target.querySelector('input');

            const nombreProducto = input.value;

            input.value = "";

            agregarProducto(nombreProducto);
        }


        /**
         * Limpiar toda la lista.
         */
        document.querySelector("#btn-limpiar").addEventListener("click", function() {

            const lista = document.querySelector("#lista-productos");

            lista.innerHTML = "";

        });


        /**
         * Ordenar productos alfabéticamente.
         */
        document.querySelector("#btn-ordenar").addEventListener("click", function() {

            const lista = document.querySelector("#lista-productos");

            const productos = Array.from(lista.children);

            productos.sort(function(a, b) {

                const nombreA = a.querySelector("span").textContent.toLowerCase();
                const nombreB = b.querySelector("span").textContent.toLowerCase();

                return nombreA.localeCompare(nombreB);

            });

            productos.forEach(function(producto) {
                lista.appendChild(producto);
            });

        });


        document.querySelector('form').addEventListener('submit', handlerFormulario);

    </script>

</body>
</html>
